<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude WakUp — panel</title>

<!--
  The browser panel. Open this file in Chrome. No server, no install.

  Two ways in, and you can switch at any time:

    BUTTONS   eight squares you press, same rule as everywhere else
    TERMINAL  type the lines yourself, with a prompt

  Both build the same .parts program, shown down the side, and both can
  run the drawing blocks right here in the page -- so a cube really does
  spin. Blocks that touch files or the network cannot run in a browser;
  those are marked, and the program still saves for the terminal to run.

  The catalogue below is written out by:  python3 -m parts json
  Do not edit it by hand -- it would drift from the blocks it describes,
  and `python3 -m parts check` would catch you.
-->

<style>
:root{
  --ink:#d7dee3; --dim:#7b8b95; --faint:#4a5a64;
  --bg:#0d1419; --panel:#141d24; --edge:#24323c;
  --on:#35bdc7; --warm:#e0a05f; --bad:#e07a5f;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
header{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border-bottom:1px solid var(--edge); background:var(--panel);
  position:sticky; top:0; z-index:5;
}
h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.02em}
h1 span{color:var(--on)}
.grow{flex:1}
button{
  font-family:var(--mono); font-size:14px; color:var(--ink);
  background:var(--panel); border:1px solid var(--edge);
  padding:7px 12px; border-radius:3px; cursor:pointer;
}
button:hover{border-color:var(--on); color:var(--on)}
button:focus-visible{outline:2px solid var(--on); outline-offset:2px}
button.on{background:var(--on); border-color:var(--on); color:#08121a}
button.quiet{color:var(--dim)}

#wrap{display:grid; grid-template-columns:1fr 300px; gap:0; min-height:calc(100vh - 47px)}
@media (max-width:760px){ #wrap{grid-template-columns:1fr} }
main{padding:14px; min-width:0}
aside{
  border-left:1px solid var(--edge); background:var(--panel);
  padding:14px; min-width:0;
}
@media (max-width:760px){ aside{border-left:0; border-top:1px solid var(--edge)} }

.label{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); margin:0 0 8px;
}

/* ---- the eight squares ---- */
#pad{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.sq{
  min-height:74px; display:flex; flex-direction:column; justify-content:center;
  align-items:center; text-align:center; gap:4px; padding:8px;
  border:1px solid var(--edge); border-radius:4px; background:var(--panel);
  cursor:pointer; color:var(--ink); font-size:14px; line-height:1.25;
}
.sq:hover{border-color:var(--on); color:var(--on)}
.sq .n{font-size:10px; color:var(--faint)}
.sq.back{color:var(--dim)}
.sq.empty{visibility:hidden; cursor:default}
#strip{
  border:1px solid var(--edge); border-radius:4px; background:var(--panel);
  padding:10px 12px; min-height:58px;
}
#strip .q{color:var(--on)}
#strip .sub{color:var(--dim); font-size:13px}

/* ---- the contrived terminal ---- */
#term{display:none}
#log{
  background:#0a1015; border:1px solid var(--edge); border-radius:4px;
  padding:10px 12px; height:46vh; overflow:auto; white-space:pre-wrap;
  font-size:13.5px;
}
#log .you{color:var(--on)}
#log .err{color:var(--bad)}
#log .note{color:var(--dim)}
#entry{display:flex; gap:8px; margin-top:8px}
#entry span{color:var(--on); padding-top:8px}
#entry input{
  flex:1; font-family:var(--mono); font-size:14px; color:var(--ink);
  background:var(--panel); border:1px solid var(--edge);
  border-radius:3px; padding:8px 10px;
}
#entry input:focus{outline:none; border-color:var(--on)}

/* ---- the depiction ---- */
#draw{
  background:#0a1015; border:1px solid var(--edge); border-radius:4px;
  padding:8px 10px; margin-top:12px; overflow:auto;
  font-size:12px; line-height:1.05; letter-spacing:0; white-space:pre;
  color:var(--on); min-height:40px;
}

/* ---- the program ---- */
#prog{display:flex; flex-direction:column; gap:2px; margin-bottom:12px}
.line{
  display:flex; gap:8px; align-items:baseline; padding:3px 6px;
  border-radius:3px; cursor:pointer;
}
.line:hover{background:#1b262e}
.line .i{color:var(--faint); font-size:11px; min-width:18px}
.line.sel{background:#1b262e; outline:1px solid var(--edge)}
.line .cant{color:var(--warm); font-size:11px}
.none{color:var(--faint); font-style:italic; padding:3px 6px}
#rowtools{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
#rowtools button{padding:5px 9px; font-size:13px}
#out{
  width:100%; height:120px; font-family:var(--mono); font-size:12.5px;
  background:#0a1015; color:var(--dim); border:1px solid var(--edge);
  border-radius:3px; padding:8px; resize:vertical;
}
</style>

<header>
  <h1>Claude <span>WakUp</span></h1>
  <button id="mode-buttons" class="on">buttons</button>
  <button id="mode-term">terminal</button>
  <span class="grow"></span>
  <button id="run">run</button>
  <button id="stop" class="quiet">stop</button>
</header>

<div id="wrap">
  <main>
    <div id="pad-view">
      <div id="strip"></div>
      <div id="pad"></div>
    </div>

    <div id="term">
      <div id="log"></div>
      <div id="entry">
        <span>&gt;</span>
        <input id="typed" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="a block a line, or: help, run, list, clear">
      </div>
    </div>

    <div id="draw"></div>
  </main>

  <aside>
    <p class="label">your program</p>
    <div id="prog"></div>
    <div id="rowtools">
      <button id="up">up</button>
      <button id="down">down</button>
      <button id="del">delete</button>
      <button id="clear">clear all</button>
    </div>
    <p class="label">as a .parts file</p>
    <textarea id="out" spellcheck="false"></textarea>
    <div id="rowtools" style="margin-top:8px">
      <button id="copy">copy</button>
      <button id="save">download</button>
      <button id="load">paste in</button>
    </div>
  </aside>
</div>

<script>
"use strict";

// ==========================================================================
//  THE CATALOGUE
//  Baked in, because Chrome will not let a file:// page fetch its own
//  folder. Rewritten by `python3 -m parts json --html`, never by hand.
// ==========================================================================
const BOOK = JSON.parse(document.getElementById("catalogue").textContent);

// What the browser can actually run. Files and the network are not
// reachable from a page, and the 3D world needs a running world, so
// those build and save but do not run here.
const RUNS_HERE = new Set([
  "const","var","put","tick","gain","bias","invert","minus","abs","clamp",
  "threshold","smooth","delay","say","count","first","last","join","text",
  "screen","clear","wipe","light","dark","meter","fill","lit","lights","draw",
  "dot","box","ball","spin","shift","grow","flat","plot"
]);

// ==========================================================================
//  THE PROGRAM
// ==========================================================================
let program = [];
let chosen  = -1;

function nameOf(line){ return (line.trim().split(/\s+/)[0] || "").toLowerCase(); }
function runnable(line){ return RUNS_HERE.has(nameOf(line)); }

function showProgram(){
  const box = document.getElementById("prog");
  box.innerHTML = "";
  if (!program.length){
    box.innerHTML = '<div class="none">nothing built yet</div>';
  } else {
    program.forEach((line, i) => {
      const el = document.createElement("div");
      el.className = "line" + (i === chosen ? " sel" : "");
      el.innerHTML = '<span class="i">' + (i + 1) + '</span>' +
        '<span>' + escape_(line) + '</span>' +
        (runnable(line) ? "" : '<span class="cant">not in browser</span>');
      el.onclick = () => { chosen = (chosen === i ? -1 : i); showProgram(); };
      box.appendChild(el);
    });
  }
  document.getElementById("out").value = program.join("\n");
}

function escape_(s){
  return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function addLine(line){ program.push(line); chosen = program.length - 1; showProgram(); }

// ==========================================================================
//  THE EIGHT SQUARES
//
//  The same rule the terminal keeps: at most eight, the last always back,
//  and a longer list turns the seventh into `more`.
// ==========================================================================
const SLOTS = 8;
let where = { at: "top", mod: null, kind: null, page: 0, holder: null };

function strip(question, sub){
  document.getElementById("strip").innerHTML =
    '<div class="q">' + escape_(question) + '</div>' +
    (sub ? '<div class="sub">' + escape_(sub) + '</div>' : "");
}

function squares(items, backLabel){
  const pad = document.getElementById("pad");
  pad.innerHTML = "";
  const room  = SLOTS - 1;
  const many  = items.length > room;
  const per   = many ? room - 1 : room;
  const pages = Math.max(1, Math.ceil(items.length / per));
  where.page  = ((where.page % pages) + pages) % pages;
  const window_ = items.slice(where.page * per, (where.page + 1) * per);

  const put = (n, label, fn, cls) => {
    const el = document.createElement("button");
    el.className = "sq" + (cls ? " " + cls : "");
    el.innerHTML = '<span class="n">' + n + '</span><span>' + escape_(label) + '</span>';
    el.onclick = fn;
    pad.appendChild(el);
  };

  let n = 0;
  window_.forEach(it => { n++; put(n, it.label, it.go); });
  if (many){ n++; put(n, "more", () => { where.page++; redraw(); }); }
  while (n < SLOTS - 1){ n++;
    const el = document.createElement("div"); el.className = "sq empty"; pad.appendChild(el); }
  put(SLOTS, backLabel.label, backLabel.go, "back");
}

function redraw(){
  if (where.at === "top") return topScreen();
  if (where.at === "mod") return modScreen();
  if (where.at === "kind") return kindScreen();
}

function topScreen(){
  where.at = "top"; where.page = 0;
  strip("Claude WakUp", BOOK.count + " blocks · pick a module to add one");
  const mods = Object.keys(BOOK.modules).sort();
  squares(mods.map(m => ({
    label: m, go: () => { where = {at:"mod", mod:m, kind:null, page:0, holder:where.holder}; redraw(); }
  })), { label: "clear all", go: () => { program = []; chosen = -1; showProgram(); } });
}

function modScreen(){
  const kinds = Object.keys(BOOK.modules[where.mod]).sort()
    .filter(k => visible(where.mod, k).length);
  strip(where.mod, where.holder ? ("choosing what `" + where.holder + "` holds") : "what sort?");
  squares(kinds.map(k => ({
    label: k + " (" + visible(where.mod, k).length + ")",
    go: () => { where.kind = k; where.at = "kind"; where.page = 0; redraw(); }
  })), { label: "back", go: topScreen });
}

function visible(mod, kind){
  const names = BOOK.modules[mod][kind];
  if (!where.holder) return names;
  return names.filter(n => !BOOK.holders.includes(n));
}

function kindScreen(){
  const names = visible(where.mod, where.kind);
  strip(where.mod + " / " + where.kind,
        where.holder ? ("`" + where.holder + "` will hold it") : "pick one to use it");
  squares(names.map(n => {
    const b = BOOK.blocks[n];
    return { label: b.name, go: () => pickBlock(b) };
  }), { label: "back", go: () => { where.at = "mod"; where.page = 0; redraw(); } });
}

function pickBlock(b){
  const low = b.name.toLowerCase();

  if (low === "fan"){
    strip("fan", "how should the branches be combined?");
    where.page = 0;
    squares(BOOK.fanways.map(w => ({
      label: w, go: () => { addLine("fan " + w); topScreen(); }
    })), { label: "back", go: () => { where.at = "kind"; redraw(); } });
    return;
  }

  if (b.holds && !where.holder){
    where.holder = low; where.at = "top"; where.page = 0;
    topScreen();
    return;
  }

  const held = where.holder;
  where.holder = null;
  askSettings(b, held);
}

function askSettings(b, held){
  const low = b.name.toLowerCase();
  if (!b.settings.length){ addLine(held ? held + " " + low : low); return topScreen(); }
  const want = b.settings.map(s =>
    s.name + (s.needed ? " (needed)" : " (" + s.default + ")")).join(", ");
  const said = prompt(b.name + " — " + b.says + "\n\nsettings: " + want +
                      "\n\nin order, spaces between, or name=value.\nblank takes the usual values.", "");
  if (said === null) return topScreen();
  const line = (low + " " + said).trim();
  addLine(held ? held + " " + line : line);
  topScreen();
}

// ==========================================================================
//  THE CONTRIVED TERMINAL
// ==========================================================================
function say(text, cls){
  const log = document.getElementById("log");
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

const HELP = [
  "A block a line, the same as a .parts file:",
  "    screen 16 8",
  "    put hot 0.8",
  "    var hot",
  "    light 3 4 at=0.5",
  "    draw",
  "",
  "Words of its own:",
  "    run        run what you have built",
  "    list       show the program",
  "    undo       take the last line back",
  "    clear      start again",
  "    blocks     every block there is",
  "    <name>?    explain one block, e.g.  light?",
  "    help       this",
].join("\n");

function terminalLine(said){
  said = said.trim();
  if (!said) return;
  say("> " + said, "you");
  const low = said.toLowerCase();

  if (low === "help"){ say(HELP, "note"); return; }
  if (low === "list"){
    say(program.length ? program.map((l,i) => (i+1) + "  " + l).join("\n")
                       : "nothing built yet", "note"); return; }
  if (low === "undo"){ program.pop(); chosen = -1; showProgram(); say("took it back", "note"); return; }
  if (low === "clear"){ program = []; chosen = -1; showProgram(); say("cleared", "note"); return; }
  if (low === "blocks"){
    Object.keys(BOOK.modules).sort().forEach(m => {
      const names = [];
      Object.keys(BOOK.modules[m]).sort().forEach(k => names.push(...BOOK.modules[m][k]));
      say(m.padEnd(8) + names.join(" "), "note");
    });
    return;
  }
  if (low === "run"){ runProgram(); return; }
  if (low.endsWith("?")){
    const b = BOOK.blocks[low.slice(0, -1)];
    if (!b){ say("no block called " + low.slice(0, -1), "err"); return; }
    say(b.name + " -- " + b.says, "note");
    if (b.more) say(b.more, "note");
    if (b.settings.length)
      say("settings: " + b.settings.map(s =>
        s.name + (s.needed ? " (needed)" : " (" + s.default + ")")).join(", "), "note");
    return;
  }

  const name = nameOf(said);
  if (!BOOK.blocks[name]){
    say("there is no block called '" + name + "'", "err");
    const near = Object.keys(BOOK.blocks)
      .filter(n => n.startsWith(name.slice(0, 2))).slice(0, 6);
    if (near.length) say("  did you mean: " + near.join(", "), "err");
    return;
  }
  addLine(said);
  if (!runnable(said)) say("  (added -- but that one cannot run in a browser)", "note");
}

document.getElementById("typed").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  terminalLine(e.target.value);
  e.target.value = "";
});

// ==========================================================================
//  RUNNING, HERE IN THE PAGE
//
//  A small reading of the same language: enough to draw. Files and the
//  network are not reachable from a page and are refused by name rather
//  than failing oddly.
// ==========================================================================
let grid = null, vars = {}, timer = null;

function Grid(w, h){
  return { w:w, h:h, cells: Array.from({length:h}, () => new Array(w).fill(0)) };
}
function gset(g, x, y, on){
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && x < g.w && y >= 0 && y < g.h) g.cells[y][x] = on ? 1 : 0;
}
function need(){ if (!grid) grid = Grid(24, 12); return grid; }
function over(v, line){ const n = Number(v); return isNaN(n) ? !!v : n > Number(line); }

function paint(){
  const g = need();
  document.getElementById("draw").textContent =
    g.cells.map(r => r.map(c => c ? "##" : "..").join("")).join("\n");
}

function settings(words){
  const loose = [], named = {};
  words.forEach(w => {
    const m = /^([A-Za-z_][A-Za-z_0-9]*)=(.*)$/.exec(w);
    if (m) named[m[1]] = value(m[2]); else loose.push(value(w));
  });
  return [loose, named];
}
function value(w){
  const low = String(w).toLowerCase();
  if (low === "true") return true;
  if (low === "false") return false;
  if (low === "none") return null;
  const n = Number(w);
  return (w !== "" && !isNaN(n)) ? n : String(w).replace(/^["']|["']$/g, "");
}

function rot(p, axis, deg){
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  let [x, y, z] = p;
  if (axis === "x"){ const ty = y*c - z*s, tz = y*s + z*c; y = ty; z = tz; }
  else if (axis === "z"){ const tx = x*c - y*s, ty = x*s + y*c; x = tx; y = ty; }
  else { const tx = x*c + z*s, tz = -x*s + z*c; x = tx; z = tz; }
  return [x, y, z];
}

function edgePoints(a, b, gap){
  const d = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const far = Math.max(...d.map(Math.abs));
  const n = Math.max(1, Math.round(far / gap));
  const out = [];
  for (let i = 0; i <= n; i++) out.push([a[0]+d[0]*i/n, a[1]+d[1]*i/n, a[2]+d[2]*i/n]);
  return out;
}

function step(line, carried){
  const words = line.trim().split(/\s+/);
  const name  = words[0].toLowerCase();
  const [loose, named] = settings(words.slice(1));
  const arg = (i, key, fallback) =>
    (named[key] !== undefined ? named[key] : (loose[i] !== undefined ? loose[i] : fallback));
  let v = carried;

  switch (name){
    case "const":  return arg(0, "value", 1);
    case "var":    return vars[arg(0, "key", "")];
    case "put":    vars[arg(0,"key","")] = (loose.length > 1 ? loose[1] : v); return v;
    case "tick": {
      const key = arg(0,"key",""), by = arg(1,"by",1), wrap = named.wrap;
      let now = (vars[key] || 0) + by;
      if (wrap) now %= wrap;
      vars[key] = now; return now;
    }
    case "gain":   return v === null ? null : v * arg(0,"k",1);
    case "bias":   return v === null ? null : v + arg(0,"k",0);
    case "invert": return v === null ? null : -v;
    case "minus":  return v === null ? null : v - arg(0,"other",0);
    case "abs":    return v === null ? null : Math.abs(v);
    case "clamp": {
      let lo = arg(0,"lo",0), hi = arg(1,"hi",1);
      if (lo > hi){ const t = lo; lo = hi; hi = t; }
      return v === null ? null : Math.max(lo, Math.min(hi, v));
    }
    case "threshold":
      return v === null ? null : (over(v, arg(0,"at",0.5)) ? arg(1,"above",1) : arg(2,"below",0));
    case "say":
      say((loose[0] !== undefined ? loose[0] + ": " : "") +
          (Array.isArray(v) ? v.length + " items" : v), "note");
      return v;
    case "count":  return Array.isArray(v) ? v.length : (v == null ? 0 : 1);

    case "screen": {
      const w = arg(0,"w","fit"), h = arg(1,"h",null);
      grid = (w === "fit" || h === null) ? Grid(24, 12) : Grid(w, h);
      return v;
    }
    case "clear": case "wipe": { const g = need();
      g.cells = Array.from({length:g.h}, () => new Array(g.w).fill(0)); return v; }
    case "light": gset(need(), arg(0,"x",0), arg(1,"y",0), over(v, arg(2,"at",0.5))); return v;
    case "dark":  gset(need(), arg(0,"x",0), arg(1,"y",0), !over(v, arg(2,"at",0.5))); return v;
    case "fill": { const g = need(), on = over(v, arg(0,"at",0.5));
      for (let y=0;y<g.h;y++) for (let x=0;x<g.w;x++) gset(g,x,y,on); return v; }
    case "meter": {
      const g = need(), x = arg(0,"x",0), y = arg(1,"y",0);
      const len = arg(2,"length",10), most = arg(3,"most",1) || 1;
      const full = Math.round(Math.max(0, Math.min(1, Number(v)/most)) * len);
      for (let i=0;i<len;i++) gset(g, x+i, y, i < full);
      return v;
    }
    case "lit":    return need().cells[arg(1,"y",0)]?.[arg(0,"x",0)] || 0;
    case "lights": return need().cells.flat().reduce((a,b)=>a+b, 0);
    case "draw":   paint(); return v;

    case "dot": return [[arg(0,"x",0), arg(1,"y",0), arg(2,"z",0)]];
    case "box": {
      const w = arg(0,"w",2)/2, h = arg(1,"h",2)/2, d = arg(2,"d",2)/2;
      const gap = arg(3,"gap",0.25);
      const c = [[-w,-h,-d],[w,-h,-d],[w,h,-d],[-w,h,-d],
                 [-w,-h,d],[w,-h,d],[w,h,d],[-w,h,d]];
      const e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],
                 [0,4],[1,5],[2,6],[3,7]];
      const out = [];
      e.forEach(([a,b]) => out.push(...edgePoints(c[a], c[b], gap)));
      return out;
    }
    case "ball": {
      const r = arg(0,"r",1.5), rings = arg(1,"rings",9), out = [];
      for (let i=0;i<rings;i++){
        const lat = Math.PI*(i+0.5)/rings;
        const n = Math.max(3, Math.round(rings*2*Math.sin(lat)));
        for (let j=0;j<n;j++){ const lon = 2*Math.PI*j/n;
          out.push([r*Math.sin(lat)*Math.cos(lon), r*Math.cos(lat), r*Math.sin(lat)*Math.sin(lon)]); }
      }
      return out;
    }
    case "spin": {
      const axis = String(arg(0,"axis","y")).toLowerCase();
      const deg  = named.var !== undefined ? (vars[named.var] || 0) : arg(1,"degrees",0);
      return (v || []).map(p => rot(p, axis, deg));
    }
    case "shift": { const dx=arg(0,"x",0), dy=arg(1,"y",0), dz=arg(2,"z",0);
      return (v||[]).map(p => [p[0]+dx, p[1]+dy, p[2]+dz]); }
    case "grow": { const k = arg(0,"k",1);
      return (v||[]).map(p => [p[0]*k, p[1]*k, p[2]*k]); }
    case "flat": {
      const g = need(), near = arg(1,"near",6);
      const zoom = named.zoom !== undefined ? named.zoom : Math.min(g.w, g.h)/5;
      const cx = g.w/2, cy = g.h/2, out = [];
      (v||[]).forEach(p => {
        let k = 1;
        if (near > 0){ const depth = near + p[2]; if (depth <= 0.1) return; k = near/depth; }
        out.push([cx + p[0]*zoom*k, cy - p[1]*zoom*k]);
      });
      return out;
    }
    case "plot": { const g = need();
      (v||[]).forEach(p => gset(g, p[0], p[1], 1)); return v; }
  }

  throw new Error("`" + name + "` does not run in a browser -- save the " +
                  "program and run it in the terminal");
}

function once(){
  let v = null;
  program.forEach((line, i) => {
    try { v = step(line, v); }
    catch (e){ throw new Error("line " + (i+1) + ": " + e.message); }
  });
  return v;
}

function runProgram(){
  stopLoop();
  if (!program.length){ say("nothing to run", "note"); return; }
  vars = {}; grid = null;
  const moving = program.some(l => nameOf(l) === "tick");
  try {
    const v = once();
    paint();
    if (!moving && v !== null && v !== undefined && !Array.isArray(v))
      say(String(v), "note");
  } catch (e){ say(String(e.message), "err"); return; }

  if (moving){
    say("running -- press stop", "note");
    timer = setInterval(() => {
      try { once(); paint(); }
      catch (e){ say(String(e.message), "err"); stopLoop(); }
    }, 90);
  }
}

function stopLoop(){ if (timer){ clearInterval(timer); timer = null; } }

// ==========================================================================
//  WIRING
// ==========================================================================
const show = which => {
  document.getElementById("pad-view").style.display = which === "buttons" ? "" : "none";
  document.getElementById("term").style.display     = which === "term" ? "" : "none";
  document.getElementById("mode-buttons").classList.toggle("on", which === "buttons");
  document.getElementById("mode-term").classList.toggle("on", which === "term");
  if (which === "term") document.getElementById("typed").focus();
};
document.getElementById("mode-buttons").onclick = () => show("buttons");
document.getElementById("mode-term").onclick    = () => show("term");
document.getElementById("run").onclick  = runProgram;
document.getElementById("stop").onclick = () => { stopLoop(); say("stopped", "note"); };

document.getElementById("up").onclick = () => {
  if (chosen > 0){ const p = program;
    [p[chosen-1], p[chosen]] = [p[chosen], p[chosen-1]]; chosen--; showProgram(); } };
document.getElementById("down").onclick = () => {
  if (chosen >= 0 && chosen < program.length - 1){ const p = program;
    [p[chosen+1], p[chosen]] = [p[chosen], p[chosen+1]]; chosen++; showProgram(); } };
document.getElementById("del").onclick = () => {
  if (chosen >= 0){ program.splice(chosen, 1); chosen = -1; showProgram(); } };
document.getElementById("clear").onclick = () => {
  program = []; chosen = -1; showProgram(); };

document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(program.join("\n"));
        say("copied", "note"); }
  catch { document.getElementById("out").select(); say("select and copy by hand", "note"); } };

document.getElementById("save").onclick = () => {
  const blob = new Blob([program.join("\n") + "\n"], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "program.parts";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("load").onclick = () => {
  const said = document.getElementById("out").value;
  program = said.split("\n").map(l => l.replace(/\s+$/,""))
                .filter(l => l.trim() && !l.trim().startsWith("#"));
  chosen = -1; showProgram(); say("read " + program.length + " lines", "note");
};

say("Claude WakUp — browser panel. " + BOOK.count + " blocks.", "note");
say("Press the squares, or switch to terminal and type. `help` for words.", "note");
showProgram();
topScreen();
</script>
