# Termux touch-button bar for the house game (GAME layout).
#
# HOW TO USE:
#   mkdir -p ~/.termux
#   cp house/termux.properties ~/.termux/termux.properties
#   termux-reload-settings          # or long-press Termux -> "Reload settings"
#
# To get your normal keys back when you're done playing, copy the other file:
#   cp house/termux-default.properties ~/.termux/termux.properties
#   termux-reload-settings
#
# In a macro: plain words are typed as text, SPACE is a space, ENTER runs it.
# The build buttons (ROOF/WALL/DOOR/WIN/CHIM/GRND) send the command with NO
# value, which CYCLES to the next option each tap.

extra-keys = [[ \
  'ESC', \
  {macro: "3d ENTER", display: "3D"}, \
  {macro: "2d ENTER", display: "2D"}, \
  {macro: "ascii ENTER", display: "ASCII"}, \
  {macro: "zoom SPACE in ENTER", display: "Z+"}, \
  {macro: "zoom SPACE out ENTER", display: "Z-"}, \
  'ENTER' \
], [ \
  {macro: "spin ENTER", display: "SPIN"}, \
  {macro: "rotate SPACE y SPACE 45 ENTER", display: "Y+45"}, \
  {macro: "rotate SPACE y SPACE -45 ENTER", display: "Y-45"}, \
  {macro: "rotate SPACE x SPACE 22.5 ENTER", display: "X+22"}, \
  {macro: "sync ENTER", display: "SYNC"}, \
  {macro: "help ENTER", display: "HELP"}, \
  'ENTER' \
], [ \
  {macro: "roof ENTER", display: "ROOF"}, \
  {macro: "walls ENTER", display: "WALL"}, \
  {macro: "door ENTER", display: "DOOR"}, \
  {macro: "windows ENTER", display: "WIN"}, \
  {macro: "chimney ENTER", display: "CHIM"}, \
  {macro: "ground ENTER", display: "GRND"}, \
  {macro: "color ENTER", display: "COL"} \
]]
