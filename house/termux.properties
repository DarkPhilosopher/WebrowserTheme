# Termux touch-button bar for the house game.
#
# HOW TO USE:
#   1. Copy this file to  ~/.termux/termux.properties
#        mkdir -p ~/.termux
#        cp house/termux.properties ~/.termux/termux.properties
#   2. Reload: long-press anywhere in Termux -> "Reload settings"
#        (or fully restart Termux).
#
# The bar above the keyboard now has buttons that TYPE-AND-RUN house commands.
# In a macro: plain words are typed as text, SPACE is a space, ENTER runs it.
# Long-press the terminal -> "More" -> keyboard is always available too.
#
# Tip: keep a copy of your old ~/.termux/termux.properties first if you had one.

extra-keys = [[ \
  'ESC', \
  {macro: "3d ENTER", display: "3D"}, \
  {macro: "2d ENTER", display: "2D"}, \
  {macro: "zoom SPACE in ENTER", display: "Z+"}, \
  {macro: "zoom SPACE out ENTER", display: "Z-"}, \
  {macro: "spin ENTER", display: "SPIN"}, \
  'ENTER' \
], [ \
  {macro: "rotate SPACE y SPACE 45 ENTER", display: "Y+45"}, \
  {macro: "rotate SPACE y SPACE -45 ENTER", display: "Y-45"}, \
  {macro: "rotate SPACE x SPACE 22.5 ENTER", display: "X+22"}, \
  {macro: "sync ENTER", display: "SYNC"}, \
  {macro: "help ENTER", display: "HELP"}, \
  'UP', \
  'DOWN' \
]]
